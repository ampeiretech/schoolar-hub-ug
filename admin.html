<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>SCHOOLAR HUB UG - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin-2@4.1.4/css/sb-admin-2.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body id="page-top">
  <div id="wrapper">
    <ul class="navbar-nav bg-gradient-dark sidebar sidebar-dark accordion" id="accordionSidebar">
      <a class="sidebar-brand d-flex align-items-center justify-content-center" href="admin.html">
        <div class="sidebar-brand-icon"><i class="fas fa-school"></i></div>
        <div class="sidebar-brand-text mx-3">Admin Portal</div>
      </a>
      <hr class="sidebar-divider my-0">
      <li class="nav-item active"><a class="nav-link" href="admin.html"><i class="fas fa-fw fa-cog"></i><span>Setup</span></a></li>
    </ul>
    <div id="content-wrapper" class="d-flex flex-column">
      <div id="content">
        <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item dropdown no-arrow">
              <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown">
                <span class="mr-2 d-none d-lg-inline text-gray-600 small">Admin</span>
                <i class="fas fa-user-circle fa-lg"></i>
              </a>
              <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in">
                <a class="dropdown-item" href="#" onclick="logout()"><i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i> Logout</a>
              </div>
            </li>
          </ul>
        </nav>
        <div class="container-fluid">
          <h1 class="h3 mb-4 text-gray-800">School Setup</h1>
          <div class="row">
            <div class="col-lg-4">
              <div class="card shadow mb-4">
                <div class="card-header py-3"><h6 class="m-0 font-weight-bold text-primary">Initialize School</h6></div>
                <div class="card-body">
                  <button class="btn btn-primary btn-block" onclick="initSchool()">Get School Code</button>
                  <div id="schCode" class="alert alert-success mt-3 d-none"></div>
                </div>
              </div>
            </div>
            <div class="col-lg-4">
              <div class="card shadow mb-4">
                <div class="card-header py-3"><h6 class="m-0 font-weight-bold text-primary">Add Class</h6></div>
                <div class="card-body">
                  <input type="text" id="className" class="form-control mb-3" placeholder="e.g. P1, S2">
                  <button class="btn btn-primary btn-block" onclick="addClass()">Add Class</button>
                </div>
              </div>
            </div>
            <div class="col-lg-4">
              <div class="card shadow mb-4">
                <div class="card-header py-3"><h6 class="m-0 font-weight-bold text-primary">Add Teacher</h6></div>
                <div class="card-body">
                  <input type="text" id="tName" class="form-control form-control-sm mb-2" placeholder="Teacher Name">
                  <input type="text" id="tUser" class="form-control form-control-sm mb-2" placeholder="Username">
                  <input type="password" id="tPass" class="form-control form-control-sm mb-2" placeholder="Password">
                  <input type="text" id="tSubj" class="form-control form-control-sm mb-3" placeholder="Subject Name">
                  <button class="btn btn-primary btn-block" onclick="addTeacher()">Add Teacher</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
  <script>
    const u = JSON.parse(localStorage.getItem('user')); if (!u || u.role !== 'ADMIN') window.location.href = 'index.html';
    async function initSchool() { 
      const r = await fetch('/api/quiz/schools', {method:'POST', headers:{'x-user-id':u.id,'Content-Type':'application/json'}, body:JSON.stringify({name:prompt('School Name:')})}); 
      const d = await r.json(); 
      document.getElementById('schCode').classList.remove('d-none'); 
      document.getElementById('schCode').innerText = `School Code: ${d.code}`; 
    }
    async function addClass() { 
      await fetch('/api/quiz/classes', {method:'POST', headers:{'x-user-id':u.id,'Content-Type':'application/json'}, body:JSON.stringify({name:className.value})}); 
      alert('Class Added!'); 
    }
    async function addTeacher() { 
      await fetch('/api/quiz/teachers', {method:'POST', headers:{'x-user-id':u.id,'Content-Type':'application/json'}, body:JSON.stringify({name:tName.value, username:tUser.value, password:tPass.value, subject_name:tSubj.value})}); 
      alert('Teacher Added!'); 
    }
  </script>
</body>
</html>
