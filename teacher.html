<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>SCHOOLAR HUB UG - Teacher</title>
  <link href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin-2@4.1.4/css/sb-admin-2.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body id="page-top">
  <div id="wrapper">
    <ul class="navbar-nav bg-gradient-warning sidebar sidebar-dark accordion" id="accordionSidebar">
      <a class="sidebar-brand d-flex align-items-center justify-content-center" href="teacher.html">
        <div class="sidebar-brand-icon">
          <!-- Custom Logo Integration -->
          <img src="https://z-cdn-media.chatglm.cn/files/8bef42ae-a97d-4267-889d-ec84652bc58e.png?auth_key=1885002142-b5a9ca3784fc43f6b41cda470e59d26d-0-c524a8b2d5211d7452585263766b3840" alt="Logo" class="brand-logo-img">
        </div>
        <div class="sidebar-brand-text mx-3 text-dark">Teacher</div>
      </a>
      <hr class="sidebar-divider my-0">
      <li class="nav-item active"><a class="nav-link text-dark" href="teacher.html"><i class="fas fa-fw fa-edit"></i><span>Create Quiz</span></a></li>
    </ul>
    <div id="content-wrapper" class="d-flex flex-column">
      <div id="content">
        <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item dropdown no-arrow">
              <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown">
                <span class="mr-2 d-none d-lg-inline text-gray-600 small">Teacher</span>
                <i class="fas fa-user-circle fa-lg"></i>
              </a>
              <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in">
                <a class="dropdown-item" href="#" onclick="logout()"><i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i> Logout</a>
              </div>
            </li>
          </ul>
        </nav>
        <div class="container-fluid">
          <h1 class="h3 mb-4 text-gray-800">Quiz Management & Analytics</h1>
          <div class="row">
            <div class="col-lg-6">
              <div class="card shadow mb-4">
                <div class="card-header py-3"><h6 class="m-0 font-weight-bold text-primary">Create Quiz</h6></div>
                <div class="card-body">
                  <form id="quizForm">
                    <input type="text" id="qTitle" class="form-control mb-2" placeholder="Quiz Title" required>
                    <select id="qClass" class="form-control mb-2" required></select>
                    <select id="qSubj" class="form-control mb-2" required></select>
                    <input type="text" id="qTopic" class="form-control mb-2" placeholder="Topic (e.g. Algebra)" required>
                    <div class="row">
                      <div class="col"><input type="text" id="qDay" class="form-control mb-2" placeholder="Day (Mon)"></div>
                      <div class="col"><input type="time" id="qTime" class="form-control mb-2"></div>
                      <div class="col"><input type="number" id="qTimePer" class="form-control mb-2" placeholder="Secs/Q" value="5"></div>
                    </div>
                    <button class="btn btn-warning btn-block">Create & Add Questions</button>
                  </form>
                </div>
              </div>
            </div>
            <div class="col-lg-6">
              <div class="card shadow mb-4">
                <div class="card-header py-3"><h6 class="m-0 font-weight-bold text-primary">Reports & Analytics</h6></div>
                <div class="card-body">
                  <select id="rClass" class="form-control mb-3"></select>
                  <button class="btn btn-primary btn-block mb-2" onclick="loadRep()">View Student Analysis</button>
                  <button class="btn btn-warning btn-block mb-3" onclick="loadTopics()">View Topic Weakness</button>
                  <div id="repRes" class="mt-3"></div>
                  <div id="topicRes" class="mt-3"></div>
                </div>
              </div>
            </div>
          </div>
          <div id="qModal" class="d-none">
            <div class="card shadow mb-4">
              <div class="card-header py-3"><h6 class="m-0 font-weight-bold text-success">Add Question <span id="qIdLabel" class="badge badge-success"></span></h6></div>
              <div class="card-body">
                <input type="text" id="qQText" class="form-control mb-2" placeholder="Question">
                <div class="row">
                  <div class="col"><input type="text" id="qA" class="form-control mb-2" placeholder="Opt A"></div>
                  <div class="col"><input type="text" id="qB" class="form-control mb-2" placeholder="Opt B"></div>
                </div>
                <div class="row">
                  <div class="col"><input type="text" id="qC" class="form-control mb-2" placeholder="Opt C"></div>
                  <div class="col"><input type="text" id="qD" class="form-control mb-2" placeholder="Opt D"></div>
                </div>
                <select id="qCorrect" class="form-control mb-3"><option>A</option><option>B</option><option>C</option><option>D</option></select>
                <button class="btn btn-success btn-block" onclick="addQ()">Add Question</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
  <script>
    const u = JSON.parse(localStorage.getItem('user')); if (!u || u.role !== 'TEACHER') window.location.href = 'index.html';
    let cQuizId = null;
    async function init() {
      const [c, s] = await Promise.all([fetch('/api/quiz/classes',{headers:{'x-user-id':u.id}}).then(r=>r.json()), fetch('/api/quiz/subjects',{headers:{'x-user-id':u.id}}).then(r=>r.json())]);
      qClass.innerHTML = c.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
      rClass.innerHTML = c.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
      qSubj.innerHTML = s.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
    }
    document.getElementById('quizForm').addEventListener('submit', async e => {
      e.preventDefault();
      const res = await fetch('/api/quiz/quizzes', {method:'POST', headers:{'x-user-id':u.id,'Content-Type':'application/json'}, body:JSON.stringify({title:qTitle.value, class_id:qClass.value, subject_id:qSubj.value, topic:qTopic.value, scheduled_day:qDay.value, scheduled_time:qTime.value, time_per_question:qTimePer.value})});
      const d = await res.json(); cQuizId = d.id; qIdLabel.innerText = `Quiz #${d.id}`; qModal.classList.remove('d-none');
    });
    async function addQ() {
      await fetch(`/api/quiz/quizzes/${cQuizId}/questions`, {method:'POST', headers:{'x-user-id':u.id,'Content-Type':'application/json'}, body:JSON.stringify({text:qQText.value, option_a:qA.value, option_b:qB.value, option_c:qC.value, option_d:qD.value, correct_option:qCorrect.value})});
      ['qQText','qA','qB','qC','qD'].forEach(id=>document.getElementById(id).value='');
    }
    async function loadRep() {
      topicRes.innerHTML = '';
      const d = await fetch(`/api/quiz/reports/class/${rClass.value}`,{headers:{'x-user-id':u.id}}).then(r=>r.json());
      let html = '<h6>Students Performance</h6><ul class="list-group">';
      d.students.forEach(s => {
        const attempts = d.attempts.filter(a => a.student_id === s.id);
        const avg = attempts.length ? (attempts.reduce((acc, a) => acc + a.score_percentage, 0) / attempts.length).toFixed(1) : 0;
        html += `<li class="list-group-item">${s.name} - Avg: ${avg}% (${attempts.length} attempts)</li>`;
      });
      html += '</ul>';
      repRes.innerHTML = html;
    }
    async function loadTopics() {
      repRes.innerHTML = '';
      const d = await fetch(`/api/quiz/reports/topics/${rClass.value}`,{headers:{'x-user-id':u.id}}).then(r=>r.json());
      let html = '<h6>Topic Performance (Lowest to Highest)</h6><ul class="list-group">';
      d.forEach(t => {
        const color = t.avg_score < 40 ? 'danger' : (t.avg_score < 70 ? 'warning' : 'success');
        html += `<li class="list-group-item d-flex justify-content-between align-items-center">
          <span>${t.topic} <small class="text-muted">(${t.attempts} attempts)</small></span>
          <span class="badge badge-${color} badge-pill">${parseFloat(t.avg_score).toFixed(1)}%</span>
        </li>`;
      });
      html += '</ul>';
      topicRes.innerHTML = html;
    }
    init();
  </script>
</body>
</html>
